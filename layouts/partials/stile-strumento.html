{{/* stile-strumento.html — gli stili di Sottosopra, condivisi da tutte le
     pagine degli strumenti. Stavano dentro sottosopra.html: sono stati
     estratti quando e' nata la pagina del posizionamento, per non averne
     due copie che poi divergono. */}}
<style>
  .strumento .marchio-sottosopra{display:flex;align-items:center;
    gap:clamp(.9rem,2.5vw,1.5rem);margin-bottom:2rem}
  .strumento .marchio-sottosopra img{flex-shrink:0;width:clamp(76px,12vw,108px);height:auto}
  .strumento .marchio-sottosopra b{display:block;font-size:clamp(2.1rem,6.5vw,3.5rem);
    font-weight:800;letter-spacing:-.03em;color:#0d4275;line-height:1}
  .strumento .marchio-sottosopra b i{font-style:normal;color:#f59e0b}
  .strumento .marchio-sottosopra span{display:block;font-size:clamp(.7rem,1.55vw,.88rem);
    font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--grafite);
    margin-top:.45rem}
  .strumento .marchio-sottosopra span em{font-style:normal;color:#f59e0b}
  @media (max-width:430px){.strumento .marchio-sottosopra span{letter-spacing:.08em}}

  :root{
    --carta:#f4f6f5; --foglio:#fff; --inchiostro:#11201d; --grafite:#5b6b66; --linea:#dbe2df;
    --verde:#0d6b58; --verde-chiaro:#e7f2ee;
    --giallo:#9a7209; --giallo-chiaro:#fbf3dd;
    --arancio:#b5570d; --arancio-chiaro:#fdeee0;
    --rosso:#a32338; --rosso-chiaro:#fbeaed;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  }
.strumento *{margin:0;padding:0;box-sizing:border-box}
.strumento{background:var(--carta);color:var(--inchiostro);line-height:1.6;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
/* l'intestazione del sito è position:fixed e alta 64px: senza questo spazio
   copre le prime righe della pagina, marchio compreso */
.strumento .foglio{max-width:1180px;margin:0 auto;padding:calc(64px + 2rem) clamp(1.25rem,3vw,2rem) 4rem}
.strumento a{color:var(--verde)}
.strumento .briciole{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
            color:var(--grafite);margin-bottom:1.5rem}
.strumento .briciole a{color:var(--grafite);text-decoration:none}
.strumento .occhiello{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
             color:var(--verde);margin-bottom:.9rem}
.strumento .occhiello b{color:#0d4275;font-weight:700}
.strumento h1{font-size:clamp(1.6rem,3.7vw,2.55rem);font-weight:700;letter-spacing:-.025em;
     line-height:1.15;margin-bottom:1rem;max-width:none;text-align:center}
.strumento .tesi{font-size:clamp(1.03rem,1.35vw,1.18rem);color:var(--grafite);
     max-width:none;margin-bottom:1.9rem}
.strumento .tesi b{color:var(--inchiostro);font-weight:600}

.strumento .modulo{background:var(--foglio);border:1px solid var(--linea);border-radius:4px;padding:1.25rem}
.strumento .campo{display:flex;gap:.6rem;flex-wrap:wrap}
.strumento input[type=text]{flex:1 1 250px;min-width:0;font-family:var(--mono);font-size:.95rem;padding:.85rem .9rem;
                  border:1px solid var(--linea);border-radius:3px;background:var(--carta);color:inherit}
.strumento input:focus, .strumento button:focus-visible, .strumento summary:focus-visible{outline:2px solid var(--verde);outline-offset:1px}
.strumento button{font-size:.85rem;font-weight:700;padding:.9rem 1.6rem;border:0;border-radius:3px;
         background:var(--verde);color:#fff;cursor:pointer}
.strumento button:hover{background:#0a5646}
.strumento button[disabled]{opacity:.45;cursor:default}
.strumento .nota{font-size:.82rem;color:var(--grafite);margin-top:.75rem}

/* --- campi per le parole chiave --- */
/* --- la scelta fra le due modalita' ---------------------------------------
   E' la prima decisione della pagina e finora era una riga grigia: riquadri
   grandi, colorati, e i campi delle parole chiave che compaiono solo con la
   seconda. Il bordo arancione prosegue nei campi per legarli alla scelta. */
.strumento .scelta{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:.9rem;margin:1.3rem 0 0}
.strumento .modulo input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.strumento .opzione{display:block;background:var(--foglio);border:2px solid var(--linea);
    border-radius:6px;padding:1.15rem 1.2rem 1.2rem;cursor:pointer;position:relative;
    transition:border-color .12s, background .12s, transform .08s}
.strumento .opzione:hover{transform:translateY(-1px)}
.strumento .opzione .capo{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
    font-weight:800;font-size:1.15rem;letter-spacing:-.02em;margin-bottom:.45rem;line-height:1.15}
.strumento .opzione .numero{flex:0 0 auto;display:inline-flex;align-items:center;
    justify-content:center;width:38px;height:38px;border-radius:50%;font-family:var(--mono);
    font-size:1.15rem;font-weight:700;color:#fff;background:var(--grafite);
    transition:background .12s}
.strumento .opzione p{font-size:.86rem;color:var(--grafite);line-height:1.5;margin:0;
    padding-left:48px}
.strumento .opzione .sottocapo{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;
    font-weight:700;color:var(--inchiostro);margin:0 0 .45rem;line-height:1.4}
.strumento .opzione .spunta{position:absolute;top:.9rem;right:1rem;font-size:1.1rem;
    color:transparent}
.strumento .opzione .nuovo{display:inline-block;font-family:var(--mono);font-size:.58rem;
    letter-spacing:.11em;text-transform:uppercase;color:#11201d;background:#f59e0b;
    border-radius:3px;padding:.18rem .42rem}

.strumento #modo1:checked + .opzione{border-color:var(--verde);background:#eef6f3}
.strumento #modo1:checked + .opzione .numero{background:var(--verde)}
.strumento #modo1:checked + .opzione .capo{color:var(--verde)}
.strumento #modo1:checked + .opzione .spunta{color:var(--verde)}
.strumento #modo2:checked + .opzione{border-color:#f59e0b;background:#fffaf0}
.strumento #modo2:checked + .opzione .numero{background:#0d4275}
.strumento #modo2:checked + .opzione .capo{color:#0d4275}
.strumento #modo2:checked + .opzione .spunta{color:#b3730a}

/* I campi compaiono con la modalita' 2. La classe la mette il JavaScript:
   i radio stanno dentro .scelta e i campi fuori, quindi non sono fratelli e
   il selettore ~ non li raggiunge. Lo strumento richiede comunque JS. */
.strumento .parole-chiave{display:none;margin-top:1.2rem;padding-top:1.1rem;
    border-top:2px solid #f59e0b}
.strumento .modulo.con-parole .parole-chiave{display:block}
.strumento .parole-chiave label{display:block;font-family:var(--mono);font-size:.68rem;
    letter-spacing:.09em;text-transform:uppercase;color:var(--grafite);margin:0 0 .35rem}
.strumento .parole-chiave label em{font-style:normal;text-transform:none;letter-spacing:0}
.strumento .parole-chiave input{width:100%;font-family:var(--mono);font-size:.9rem;
    padding:.7rem .8rem;border:1px solid var(--linea);border-radius:3px;background:var(--carta);
    margin-bottom:.9rem}
.strumento .parole-chiave select{width:100%;font-size:.92rem;padding:.7rem .8rem;
    border:1px solid var(--linea);border-radius:3px;background:var(--foglio);
    color:var(--inchiostro)}
/* --- verifica anti-abuso: compare solo con la modalita' 2, perche' e'
   l'unica che interroga un servizio a pagamento ------------------------- */
.strumento .blocco-turnstile{margin-top:1.2rem;padding-top:1rem;
    border-top:1px dashed var(--linea)}
.strumento .riga-spiega{font-size:.82rem;color:var(--grafite);
    margin-top:.55rem;max-width:52ch}
@media (max-width:420px){
  .strumento .opzione .capo{font-size:1.02rem}
  .strumento .opzione p{padding-left:0;margin-top:.2rem}
}

/* --- blocco delle posizioni nel rapporto ---------------------------------
   Il colore qui non è decorazione: dice a che altezza sei. Verde primi tre,
   blu prima pagina, arancione seconda pagina, grigio fuori. Chi guarda capisce
   la situazione prima di leggere i numeri. */
/* --- Posizioni su Google -------------------------------------------------
   In chiaro solo i numeri; le spiegazioni stanno nelle tendine, lo stesso
   elemento dei quarantotto controlli. Rosa l'Italia, verde la citta'. */
.strumento .posizioni{margin:1.3rem 0 1rem;display:grid;gap:1rem}

.strumento .scheda-parola{background:var(--foglio);border:1px solid var(--linea);
    border-left:4px solid var(--linea);border-radius:4px;padding:1rem 1.1rem}
.strumento .scheda-parola.alto{border-left-color:#0d6b58}
.strumento .scheda-parola.medio{border-left-color:#0d4275}
.strumento .scheda-parola.basso{border-left-color:#f59e0b}
.strumento .scheda-parola .parola{display:block;font-weight:700;font-size:1.02rem;
    letter-spacing:-.01em;margin:0 0 .8rem;word-break:break-word}

.strumento .luoghi{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.7rem}
.strumento .luogo{border-radius:4px;padding:.7rem .8rem}
.strumento .luogo.italia{background:#fdf2f5;border:1px solid #e7c3ce;border-left:3px solid #b3124f}
.strumento .luogo.citta{background:#eef6f3;border:1px solid #bcd9d0;border-left:3px solid #0d6b58}
.strumento .luogo .dove{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;
    text-transform:uppercase;font-weight:700;margin:0 0 .5rem}
.strumento .luogo.italia .dove{color:#b3124f}
.strumento .luogo.citta .dove{color:#0d6b58}

.strumento .misura{display:flex;align-items:center;justify-content:space-between;gap:.7rem;
    padding:.4rem 0}
.strumento .misura + .misura{border-top:1px solid rgba(0,0,0,.06)}
.strumento .misura .tipo{font-size:.82rem;color:var(--inchiostro);line-height:1.25}
.strumento .misura .sigla{display:block;font-family:var(--mono);font-size:.62rem;
    letter-spacing:.06em;color:var(--grafite);margin-top:.1rem}
.strumento .misura .valore{flex:0 0 auto;text-align:right;white-space:nowrap}
.strumento .misura .numero{font-family:var(--mono);font-weight:700;font-size:1.2rem;
    color:var(--grafite)}
.strumento .misura .numero.alto{color:#0d6b58}
.strumento .misura .numero.medio{color:#0d4275}
.strumento .misura .numero.basso{color:#b3730a}
.strumento .misura .sotto{font-size:.7rem;color:var(--grafite);margin-left:.35rem}
.strumento .misura .fuori{font-size:.76rem;color:var(--grafite)}
.strumento .misura .fuori.attenzione{color:#b3730a;font-weight:600}

.strumento .scheda-parola details,
.strumento .posizioni + details{margin:.7rem 0 0;border-top:1px solid var(--linea);
    padding-top:.55rem}
.strumento .scheda-parola details + details{margin-top:.35rem}
.strumento .scheda-parola summary,
.strumento .posizioni + details > summary{cursor:pointer;font-size:.79rem;color:var(--verde);
    font-weight:600;list-style:none;display:flex;align-items:center;gap:.4rem}
.strumento .scheda-parola summary::-webkit-details-marker,
.strumento .posizioni + details > summary::-webkit-details-marker{display:none}
.strumento .scheda-parola summary::before,
.strumento .posizioni + details > summary::before{content:"\25B8";font-size:.7rem;
    transition:transform .12s}
.strumento .scheda-parola details[open] summary::before,
.strumento .posizioni + details[open] > summary::before{transform:rotate(90deg)}
.strumento .scheda-parola summary.avviso{color:#b3730a}
.strumento .dentro{font-size:.83rem;line-height:1.6;color:var(--grafite);padding:.55rem 0 .2rem;
    max-width:88ch}
.strumento .dentro p{margin:0 0 .5rem}
.strumento .dentro p:last-child{margin:0}
.strumento .dentro b{color:var(--inchiostro);font-weight:600}

/* le liste raggruppate per localita', con lo stesso colore delle caselle */
.strumento .dentro .gruppo{margin:0 0 .9rem;padding-left:.7rem;border-left:3px solid var(--linea)}
.strumento .dentro .gruppo:last-child{margin-bottom:0}
.strumento .dentro .gruppo.italia{border-left-color:#b3124f}
.strumento .dentro .gruppo.citta{border-left-color:#0d6b58}
.strumento .dentro .luogo-capo{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;
    text-transform:uppercase;font-weight:700;margin:0 0 .45rem}
.strumento .dentro .gruppo.italia .luogo-capo{color:#b3124f}
.strumento .dentro .gruppo.citta .luogo-capo{color:#0d6b58}
.strumento .dentro .capolista{font-size:.76rem;color:var(--grafite);margin:.6rem 0 .3rem;
    line-height:1.4}
.strumento .dentro .capolista:first-child{margin-top:0}
.strumento .dentro .capolista b{color:var(--inchiostro);font-weight:700}
.strumento .concorrenti{display:flex;flex-wrap:wrap;gap:.35rem;margin:0;padding:0;list-style:none}
/* i nomi delle attivita' non sono indirizzi: carattere normale, non macchina */
.strumento .concorrenti.nomi li{font-family:inherit;font-size:.78rem}
.strumento .concorrenti li{font-family:var(--mono);font-size:.72rem;background:var(--carta);
    border:1px solid var(--linea);border-radius:3px;padding:.2rem .45rem;color:var(--grafite)}
.strumento .concorrenti li a{color:#0d4275;text-decoration:none;display:block}
.strumento .concorrenti li a:hover{text-decoration:underline}
.strumento .concorrenti li a::after{content:"\2197";font-size:.72em;margin-left:.3em;opacity:.6}
.strumento .concorrenti li.senza-link{color:var(--grafite)}

.strumento .posizioni-nota{font-size:.78rem;color:var(--grafite);margin:1rem 0 0;line-height:1.5}
.strumento .posizioni-nota.guasto{color:#b3730a}

@media (max-width:520px){
  .strumento .misura{flex-direction:column;align-items:flex-start;gap:.15rem}
  .strumento .misura .valore{text-align:left}
}
.strumento code{font-family:var(--mono);font-size:.92em;background:var(--carta);padding:.1rem .3rem;border-radius:3px}
/* --- attesa ---------------------------------------------------------------
   Era un filo da 3 pixel con una riga grigia: durante un minuto di attesa non
   dava alcun segno di vita. Ora e' un riquadro con la barra spessa, il testo
   in nero e una striscia che scorre per dire che qualcosa si sta muovendo
   anche mentre la percentuale sta ferma. */
.strumento .avanzamento{display:none;margin-top:1.25rem;background:var(--foglio);
    border:1px solid var(--linea);border-left:4px solid var(--verde);border-radius:4px;
    padding:1.1rem 1.2rem;scroll-margin-top:calc(64px + 1.5rem)}
.strumento .avanzamento.attivo{display:block}
.strumento .barra{position:relative;height:14px;background:var(--carta);border-radius:7px;
    overflow:hidden;border:1px solid var(--linea)}
.strumento .barra i{display:block;height:100%;width:0;border-radius:7px;background:var(--verde);
    transition:width .3s ease}
/* la striscia obliqua che scorre: dice "sto lavorando" anche a barra ferma */
.strumento .barra i::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(115deg,rgba(255,255,255,.35) 25%,transparent 25%,
    transparent 50%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.35) 75%,transparent 75%);
    background-size:22px 22px;animation:scorre 1s linear infinite}
@keyframes scorre{from{background-position:0 0}to{background-position:22px 0}}
@media (prefers-reduced-motion:reduce){.strumento .barra i::after{animation:none}}
.strumento .passo{font-size:.95rem;font-weight:600;color:var(--inchiostro);margin-top:.75rem;
    line-height:1.45}
.strumento .errore{background:#fdf1f3;border:1px solid #edccd3;border-left:3px solid var(--rosso);
          padding:1rem 1.15rem;margin-top:1.25rem;font-size:.94rem;border-radius:3px}
.strumento .esito{margin-top:2.5rem;display:none;scroll-margin-top:calc(64px + 1rem)}
.strumento .campione-magro{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.5);
    border-left:4px solid #f59e0b;border-radius:4px;padding:.9rem 1.1rem;margin:0 0 1.4rem;
    font-size:.9rem;line-height:1.55}
.strumento .campione-magro b{color:#8a5808}
.strumento .testata-esito{background:var(--foglio);border:1px solid var(--linea);
    border-left:4px solid #0d4275;border-radius:4px;
    padding:clamp(1rem,2.5vw,1.4rem) clamp(1.1rem,3vw,1.5rem);margin-bottom:1.6rem}
.strumento .testata-esito b{display:block;font-size:clamp(1.3rem,4vw,1.75rem);font-weight:800;
    letter-spacing:-.03em;color:#0d4275;line-height:1.1}
.strumento .testata-esito b i{font-style:normal;color:#f59e0b}
.strumento .testata-esito span{display:block;font-family:var(--mono);font-size:.76rem;
    color:var(--grafite);word-break:break-all;margin-top:.4rem}
.strumento .esito.attivo{display:block}
.strumento h2{font-size:1.22rem;font-weight:700;letter-spacing:-.015em;margin:2.6rem 0 1rem}
.strumento h2:first-child{margin-top:0}
.strumento h3{font-size:.95rem;font-weight:700;margin:1.5rem 0 .5rem}
.strumento .punteggio{background:var(--foglio);border:1px solid var(--linea);border-radius:4px;padding:1.5rem;
             display:flex;gap:1.6rem;align-items:center;flex-wrap:wrap}
.strumento .quadrante{position:relative;width:112px;height:112px;flex-shrink:0}
.strumento .quadrante svg{transform:rotate(-90deg)}
.strumento .quadrante b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
               font-size:2rem;font-weight:700;letter-spacing:-.04em}
.strumento .punteggio .parole{flex:1 1 260px;min-width:0}
/* i pulsanti per portarsi via il rapporto, subito accanto al punteggio */
.strumento .azione-salva{flex:0 0 auto;margin-left:auto;text-align:right}
.strumento .btn-salva{display:inline-block;background:#fff;border:1px solid var(--verde);
    color:var(--verde);font-size:.85rem;font-weight:700;text-decoration:none;padding:.6rem 1rem;
    border-radius:3px;white-space:nowrap}
.strumento .btn-salva:hover{background:var(--verde);color:#fff}
.strumento .minuta-salva{display:block;font-size:.72rem;color:var(--grafite);margin-top:.45rem;
    text-decoration:underline;text-underline-offset:2px}
@media (max-width:780px){
  .strumento .azione-salva{flex:1 1 100%;margin-left:0;text-align:left;margin-top:.6rem}
}
@media print{.strumento .azione-salva{display:none !important}}
.strumento .dominio{font-family:var(--mono);font-size:.78rem;color:var(--grafite);word-break:break-all;margin-bottom:.35rem}
.strumento .conCosa{font-size:1.02rem;margin-bottom:.3rem}
.strumento .conCosa b{color:var(--verde)}
.strumento .gruppi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;
          background:var(--linea);border:1px solid var(--linea);margin-top:1px}
.strumento .gruppi div{background:var(--foglio);padding:.85rem 1rem}
.strumento .gruppi b{display:block;font-family:var(--mono);font-size:1.3rem;font-weight:700;letter-spacing:-.03em}
.strumento .gruppi span{font-size:.72rem;color:var(--grafite);display:block;line-height:1.35}
.strumento .gruppi i{display:block;height:3px;background:var(--linea);margin-top:.5rem;border-radius:2px;overflow:hidden}
.strumento .gruppi i em{display:block;height:100%;background:var(--verde)}
.strumento table{width:100%;border-collapse:collapse;background:var(--foglio);border:1px solid var(--linea);
        font-size:.89rem;border-radius:4px;overflow:hidden}
.strumento th, .strumento td{padding:.55rem .85rem;text-align:left;border-bottom:1px solid var(--linea)}
.strumento tr:last-child td{border-bottom:0}
.strumento th{font-family:var(--mono);font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;
     color:var(--grafite);font-weight:600;background:#f8faf9}
.strumento td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.strumento td.percorso{font-family:var(--mono);font-size:.79rem;word-break:break-all}
.strumento .si{color:var(--verde);font-weight:700}
.strumento .no{color:var(--rosso);font-weight:700}
.strumento .parziale{color:var(--ambra);font-weight:700}
.strumento .controllo{background:var(--foglio);border:1px solid var(--linea);border-radius:4px;margin-bottom:.4rem}
.strumento .controllo>summary{padding:.65rem .9rem;cursor:pointer;display:flex;gap:.75rem;align-items:baseline;
                     justify-content:space-between;list-style:none}
.strumento .controllo>summary::-webkit-details-marker{display:none}
.strumento .controllo>summary::after{content:'spiega';font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;
                            text-transform:uppercase;color:var(--grafite);flex-shrink:0}
.strumento .controllo[open]>summary::after{content:'chiudi'}
.strumento .controllo .che{flex:1}
.strumento .controllo .val{font-family:var(--mono);font-size:.78rem;white-space:nowrap}

.strumento .azioni{display:flex;gap:.7rem;flex-wrap:wrap}

.strumento .azioni a.vuoto{background:transparent;color:#fff;border:1px solid #4a5b57}

.strumento .liv-ok{color:var(--verde)}

.strumento .liv-rosso{color:var(--rosso)}

.strumento .pill{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.7rem;

.strumento .pill.liv-giallo{background:var(--giallo-chiaro)}

.strumento .punti-voce{font-family:var(--mono);font-size:.74rem;color:var(--grafite);white-space:nowrap}
.strumento .controllo>summary{align-items:center}
.strumento .controllo .che{display:flex;align-items:center;gap:.55rem}
.strumento .controllo.liv-rosso{border-left:3px solid var(--rosso)}
.strumento .controllo.liv-arancio{border-left:3px solid var(--arancio)}
.strumento .controllo.liv-giallo{border-left:3px solid var(--giallo)}
.strumento .controllo.liv-ok{border-left:3px solid var(--verde)}

.strumento .legenda span{display:inline-flex;align-items:center;gap:.35rem}
.strumento /* --- testo editoriale in fondo --- */
  #perche{margin-top:3rem}
/* la sezione sui crawler AI veste come #perche: e' prosa, non interfaccia */
.strumento #posizioni-sez h2{font-size:1.22rem;margin:2.4rem 0 .8rem}

.strumento #posizioni-sez p{max-width:88ch;margin-bottom:.9rem;color:#3d4b47}
.strumento #posizioni-sez strong{color:var(--inchiostro)}
.strumento #leggibile h2{font-size:1.22rem;margin:2.4rem 0 .8rem}
.strumento #leggibile h3{font-size:1rem;margin:1.6rem 0 .5rem;color:var(--verde)}
.strumento #leggibile p{max-width:88ch;margin-bottom:.9rem;color:#3d4b47}
.strumento #leggibile strong{color:var(--inchiostro)}
/* I due gruppi di crawler, ognuno col suo colore: arancione chi ti fa sparire
   dalle risposte se lo blocchi, blu chi raccoglie e basta. Il colore dice
   quale blocco e' pericoloso, non decora. */
.strumento .gruppo-bot{border-radius:4px;padding:1rem 1.15rem;margin:.8rem 0 1.4rem;max-width:88ch}
.strumento .gruppo-bot.risposte{background:#fffaf0;border:1px solid #f2ddb4;
    border-left:4px solid #f59e0b}

.strumento .gruppo-bot.risposte .capo{color:#8a5808}
.strumento .gruppo-bot.raccolta .capo{color:#0d4275}
.strumento .gruppo-bot p{font-size:.86rem;line-height:1.65;color:#3d4b47;margin:0;max-width:none}
.strumento .gruppo-bot p + p{margin-top:.6rem}
.strumento .gruppo-bot code{font-family:var(--mono);font-size:.8em;border-radius:3px;

.strumento .gruppo-bot.risposte code{background:#fdf0d8;border:1px solid #f0d3a0;color:#7a4d06}
.strumento .gruppo-bot.raccolta code{background:#e6eef6;border:1px solid #c2d5e6;color:#0d4275}
.strumento .gruppo-bot .morale{font-weight:600;color:var(--inchiostro)}
.strumento #perche h2{font-size:1.22rem;margin:2.4rem 0 .8rem}
.strumento #perche h3{font-size:1rem;margin:1.6rem 0 .5rem;color:var(--verde)}
/* Era un H2, ma introduceva tre difetti che ora sono H3: come intestazione

.strumento #perche .capitoletto{font-size:1.02rem;font-weight:700;color:var(--inchiostro);
    margin:2rem 0 .2rem;max-width:88ch}
.strumento #perche p{max-width:88ch;margin-bottom:.9rem;color:#3d4b47}
.strumento #perche em{font-style:italic}
.strumento #perche strong{color:var(--inchiostro)}
.strumento /* --- schede dei contenuti --- */
  .contenuto{background:var(--carta);border:1px solid var(--linea);border-radius:8px;
    margin-bottom:6px;overflow:hidden}
.strumento .contenuto>summary{cursor:pointer;padding:.6rem .8rem;display:flex;align-items:center;
    gap:.5rem;flex-wrap:wrap;list-style:none}
.strumento .contenuto>summary::-webkit-details-marker{display:none}
.strumento .contenuto>summary:hover{background:var(--fondo)}
.strumento .contenuto .dove{font-family:var(--mono);font-size:.8rem;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--inchiostro)}
.strumento .contenuto .pill{font-family:var(--mono);font-size:.68rem;padding:.12rem .4rem;
    border-radius:4px;background:var(--fondo);white-space:nowrap}

.strumento .campo .testo.mono{font-family:var(--mono);font-size:.78rem;word-break:break-all}
.strumento .campo .misura{display:block;font-size:.76rem;color:var(--grafite);margin-top:.15rem}
.strumento .campo .misura.mono{font-family:var(--mono);word-break:break-all}
.strumento .scaletta{margin-top:.3rem;border-left:2px solid var(--linea);padding-left:.2rem}
.strumento .riga-h{font-size:.84rem;padding-top:.16rem;padding-bottom:.16rem;line-height:1.35}
.strumento .riga-h .liv{font-family:var(--mono);font-size:.68rem;color:var(--grafite);
    display:inline-block;min-width:1.9rem}
.strumento .riga-h.salto{background:#fdf6e8;border-radius:3px}
.strumento .riga-h .avviso{font-size:.7rem;color:var(--giallo);margin-left:.4rem}
.strumento table.meta{width:100%;border-collapse:collapse;margin-top:.3rem;font-size:.82rem}

.strumento table.meta .chiave{font-family:var(--mono);font-size:.74rem;color:var(--grafite);
    white-space:nowrap;width:1%;padding-right:.9rem}
.strumento table.meta .valore{word-break:break-word}
.strumento table.meta .spiegam{display:block;font-size:.74rem;color:var(--grafite);margin-top:.1rem}
.strumento /* --- richiamo all'estensione --- */
  .blocco-estensione{background:var(--verde);color:#fff;border-radius:12px;
    padding:1.6rem 1.5rem;margin:2.5rem 0 1rem}
.strumento .blocco-estensione .etichetta{display:block;font-family:var(--mono);font-size:.7rem;
    letter-spacing:.09em;text-transform:uppercase;opacity:.75;margin-bottom:.4rem}

.strumento .blocco-estensione p{max-width:88ch;opacity:.92;font-size:.95rem;margin-bottom:1rem}
.strumento .bottone-estensione{display:inline-block;background:#fff;color:var(--verde);
    text-decoration:none;font-weight:600;padding:.6rem 1.2rem;border-radius:8px}
.strumento .bottone-estensione:hover{background:var(--carta)}
.strumento .blocco-estensione .minuta{display:block;font-size:.78rem;opacity:.72;margin-top:.6rem}
.strumento /* --- testata: grafico e riquadri affiancati --- */
  .testata-gruppi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:1rem;align-items:center;background:var(--carta);border:1px solid var(--linea);
    border-radius:12px;padding:1rem;margin-bottom:1.5rem}
.strumento .testata-gruppi .gruppi{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin:0}
.strumento .testata-gruppi .gruppi>div, .strumento .testata-gruppi .gruppi>a{background:var(--fondo);border:0;border-radius:7px;
    padding:.5rem .6rem}
.strumento .testata-gruppi .gruppi b{display:block;font-size:1.05rem;line-height:1.1}
.strumento .testata-gruppi .gruppi>div>span, .strumento .testata-gruppi .gruppi>a>span{font-size:.72rem;color:var(--grafite);

.strumento .testata-gruppi .gruppi i{display:block;height:3px;background:var(--linea);
    margin-top:.35rem;border-radius:2px}
.strumento .testata-gruppi .gruppi i em{display:block;height:100%;border-radius:2px}
.strumento .ragnatela{display:block;width:100%;height:auto}
.strumento .ragnatela .et-nome{font-size:12px;font-weight:600;fill:var(--inchiostro);font-family:inherit}
@media (max-width:640px){.strumento .testata-gruppi{grid-template-columns:1fr}
.strumento .lato-grafico{max-width:340px;margin:0 auto}}
.strumento /* --- dove manca: elenco delle pagine con il valore --- */
  .dove-manca{margin:.7rem 0;padding-top:.6rem;border-top:1px solid var(--linea)}
.strumento .dove-manca>b, .strumento .dove-manca>summary>b{display:block;font-size:.72rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--grafite);margin-bottom:.35rem}
.strumento .dove-manca.chiusa>summary{cursor:pointer;list-style:none;display:flex;
    align-items:baseline;gap:.5rem;margin-bottom:.3rem}
.strumento .dove-manca.chiusa>summary::-webkit-details-marker{display:none}
.strumento .dove-manca.chiusa>summary .apri{font-size:.76rem;color:var(--verde);text-decoration:underline;
    text-underline-offset:2px;margin-left:auto}
.strumento .dove-manca.chiusa[open]>summary .apri::after{content:" (chiudi)"}
.strumento .riga-dove{display:flex;gap:.6rem;align-items:baseline;padding:.14rem 0;
    border-bottom:1px solid var(--linea)}
.strumento .riga-dove:last-child{border-bottom:0}
.strumento .riga-dove a{font-family:var(--mono);font-size:.76rem;color:var(--verde);
    text-decoration:none;word-break:break-all;flex:1}
.strumento .riga-dove a:hover{text-decoration:underline}
.strumento .riga-dove code{font-family:var(--mono);font-size:.76rem;color:var(--rosso);
    word-break:break-all;flex:1}
.strumento .riga-dove em{font-style:normal;font-size:.76rem;color:var(--grafite);white-space:nowrap}
.strumento .difetto{background:var(--fondo);border-radius:6px;padding:.5rem .7rem;margin:.2rem 0 .5rem}
.strumento .difetto b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--grafite);margin-bottom:.15rem}
.strumento /* --- velocità: cerchi e pallini --- */
  .cerchi-velocita{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:.6rem;margin:0 0 1rem;background:var(--carta);border:1px solid var(--linea);

.strumento .cerchi-velocita>div{text-align:center}
.strumento .cerchi-velocita svg{margin:0 auto .35rem}
.strumento .cerchi-velocita span{display:block;font-size:.78rem;color:var(--grafite);line-height:1.3}
.strumento td.metrica{display:flex;gap:.55rem;align-items:flex-start}
.strumento td.metrica .segno{font-size:.7rem;line-height:1.7;flex-shrink:0}
.strumento td.metrica b{font-weight:600}
.strumento .riquadro-gruppo{display:block;text-decoration:none;color:inherit;
    background:var(--fondo);border:1px solid transparent;border-radius:7px;
    padding:.5rem .6rem;transition:border-color .12s,background .12s}
.strumento .riquadro-gruppo:hover, .strumento .riquadro-gruppo:focus-visible{border-color:var(--verde);
    background:var(--carta);outline:none}
.strumento .titolo-gruppo{scroll-margin-top:1rem}
.strumento /* --- cerchio nel titolo di gruppo --- */
  .titolo-gruppo{display:flex;align-items:center;gap:.7rem;margin:1.8rem 0 .6rem;
    font-size:1rem;font-weight:600}
.strumento .titolo-gruppo .nome{flex:1}
.strumento .titolo-gruppo .punti{font-family:var(--mono);font-size:.75rem;color:var(--grafite);

.strumento .cerchio-gruppo{flex-shrink:0;display:block}
@media (max-width:520px){.strumento .titolo-gruppo{font-size:.92rem;gap:.5rem}
.strumento .titolo-gruppo .punti{display:none}}
.strumento .altre-pagine>summary, .strumento .altre-schede>summary{cursor:pointer;padding:.6rem .9rem;
    background:var(--carta);border:1px solid var(--linea);border-radius:8px;font-size:.88rem;
    color:var(--verde);margin:.5rem 0}
.strumento .altre-pagine>summary:hover, .strumento .altre-schede>summary:hover{border-color:var(--verde)}
.strumento .altre-pagine[open]>summary::after, .strumento .altre-schede[open]>summary::after{content:" — chiudi";
    color:var(--grafite)}
/* --- STAMPA -----------------------------------------------------------------
   Il "salva in PDF" del browser passa di qui. L'obiettivo e' un documento da
   mostrare a un cliente: niente interfaccia, niente riquadri spezzati fra due
   pagine, marchio in testa e indirizzo analizzato in ogni foglio. Il testo
   resta testo, quindi il file pesa poche centinaia di kilobyte e si puo'
   cercare dentro. */
@page{margin:16mm 14mm 18mm}

@media print{
  .strumento{background:#fff}
  .strumento .foglio{max-width:none;padding:0}

  /* via tutto cio' che e' interfaccia e non serve su carta */
  .strumento .modulo, .strumento .avanzamento, .strumento .azioni,
  .strumento button, .strumento .briciole, .strumento .occhiello,
  .strumento h1, .strumento #leggibile, .strumento .blocco-estensione,
  .strumento #perche, .strumento .faq, .strumento .azione-pdf,
  .strumento .esito > section:last-of-type{display:none !important}

  /* i colori di sfondo vanno stampati: senza, i riquadri spariscono */
  .strumento *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* intestazione del documento: il marchio piccolo, in linea */
  .strumento .marchio-sottosopra{margin:0 0 .6rem;gap:.7rem;
    border-bottom:1px solid #dbe2df;padding-bottom:.6rem}
  .strumento .marchio-sottosopra img{width:34px}
  .strumento .marchio-sottosopra b{font-size:1.3rem}
  .strumento .marchio-sottosopra span{font-size:.6rem;margin-top:.15rem}

  /* niente si spezza a meta' fra due pagine */
  .strumento .punteggio, .strumento .scheda-parola, .strumento .gruppo,
  .strumento .controllo, .strumento .voce, .strumento .gruppi div,
  .strumento .testata-esito, .strumento .luogo,
  .strumento table, .strumento tr{break-inside:avoid; page-break-inside:avoid}
  .strumento h2, .strumento h3{break-after:avoid; page-break-after:avoid}
  .strumento h2{margin-top:1.2rem}

  /* le tendine dei controlli aperte, altrimenti si stampa un elenco muto */
  .strumento .controllo[open] .spiega{display:block}
  .strumento details{break-inside:avoid}
  .strumento details > summary{list-style:none}

  /* i collegamenti: su carta l'indirizzo va scritto, non nascosto */
  .strumento .concorrenti li a::after{content:" (" attr(href) ")";font-size:.72em;
    color:#5b6b66;opacity:1}

  /* corpo del testo un filo piu' piccolo: meno fogli, stessa leggibilita' */
  .strumento{font-size:10.5pt;line-height:1.45}
