baseURL = 'https://puntowebferrara.com/'
languageCode = 'it'
title = 'Web Designer Ferrara | Punto Web Ferrara'
enableRobotsTXT = false

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# Priority personalizzate per pagina nel front matter

[menus]
  [[menus.main]]
    name = 'Home'
    url = '/'
    weight = 1
  [[menus.main]]
    name = 'Servizi'
    url = '/servizi/'
    weight = 2
  [[menus.main]]
    name = 'Allevamenti'
    url = '/siti-web-allevamenti/'
    weight = 3
  [[menus.main]]
    name = 'Chi Sono'
    url = '/chi-siamo/'
    weight = 4
  [[menus.main]]
    name = 'Portfolio'
    url = '/portfolio/'
    weight = 5
  [[menus.main]]
    name = 'Strumenti'
    identifier = 'strumenti'
    url = '/sottosopra/'
    weight = 6
  # Sottovoci della tendina. Se ne aggiunge una SOLO quando la pagina esiste
  # davvero: un menu che promette pagine inesistenti e' un 404 con l'invito.
  [[menus.main]]
    name = 'Verifica SEO e GEO'
    parent = 'strumenti'
    url = '/sottosopra/'
    weight = 1
    [menus.main.params]
      riga = '48 controlli tecnici sul sito: dati strutturati, velocità, crawler IA.'
  [[menus.main]]
    name = 'Posizionamento su Google'
    parent = 'strumenti'
    url = '/sottosopra/posizionamento/'
    weight = 2
    [menus.main.params]
      riga = 'Vedi se compari nella prima pagina, e a che posizione.'
  [[menus.main]]
    name = 'Accessibilità'
    parent = 'strumenti'
    url = '/sottosopra/accessibilita/'
    weight = 3
    [menus.main.params]
      riga = '35 controlli WCAG 2.1 AA, ognuno con il suo rimedio.'
  [[menus.main]]
    name = 'Cookie e consenso'
    parent = 'strumenti'
    url = '/sottosopra/cookie/'
    weight = 4
    [menus.main.params]
      riga = 'Quali tracciatori carichi, e se ti serve il banner.'
  [[menus.main]]
    name = 'Estensione per Chrome'
    parent = 'strumenti'
    url = '/estensione/'
    weight = 5
    [menus.main.params]
      riga = 'Analizza la pagina aperta, anche dietro login.'
  [[menus.main]]
    name = 'Blog'
    url = '/blog/'
    weight = 7
  [[menus.main]]
    name = 'Contatti'
    url = '/contatti/'
    weight = 8
  [[menus.main]]
    name = 'Preventivo'
    url = '/preventivo/'
    weight = 9

